<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Calendario a iPhone</title>
</head>
<body>
  <h1>Calendario a iPhone</h1>

  <input id="codigo" type="password" placeholder="Codigo de acceso">
  <br><br>
  <input id="file" type="file" accept="image/*">
  <br><br>
  <img id="preview" style="max-width:100%">
  <p id="estado"></p>
  <pre id="resultado"></pre>

  <script>
    const file = document.getElementById("file");
    const preview = document.getElementById("preview");
    const codigo = document.getElementById("codigo");
    const estado = document.getElementById("estado");
    const resultado = document.getElementById("resultado");

    //funcion para devolver la imagen como jpeg y reducirla
    async function reducir(foto,maximo = 1280)
    {
      const imagen = await createImageBitmap(foto, {imageOrientation: "from-image"});
      const escala = Math.min(1,maximo/Math.max(imagen.width,imagen.height));

      const lienzo = document.createElement("canvas");
      lienzo.width = Math.round(imagen.width * escala);
      lienzo.height = Math.round(imagen.height * escala);
      lienzo.getContext("2d").drawImage(imagen, 0, 0, lienzo.width, lienzo.height);

      return new Promise(resolve => lienzo.toBlob(resolve,"image/jpeg", 0.82));
    }

    file.onchange = async() => {
      const foto = file.files[0];
      if(!foto) return;
      preview.src = URL.createObjectURL(foto);

      estado.textContent = "Leyendo Calendario...";
      resultado.textContent = "";

      try {

        const reducida = await reducir(foto);
        estado.textContent = "Leyendo con la IA (unos 30 segundos)...";
        
        const respuesta = await fetch("/extract", {
          method: "POST",
          headers: {
            "X-App-Token": codigo.value,
            "Content-Type": "image/jpeg"
          },
          body: reducida
        });

        if(!respuesta.ok) {
          estado.textContent = "Error " + respuesta.status;
          return;
        }
        const datos = await respuesta.json();
        estado.textContent = "Listo";
        resultado.textContent = JSON.stringify(datos, null, 2);
      } catch(e){
        estado.textContent ="Error: " +e.message;
      }
    };
  </script>
</body>
</html>
